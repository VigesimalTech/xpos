name: Tests

on:
  pull_request: {}
  push:
    branches:
      - develop
      - main
      - "vigesimal/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-xpos-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The desktop sync integration tests run against a real MariaDB, the
    # database the desktop app uses on each till.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: yarn install --frozen-lockfile

      - name: Typecheck (web and desktop)
        run: yarn vue-tsc --noEmit && yarn tsc -p tsconfig.electron.json --noEmit

      - name: Unit tests
        run: yarn test:run

      - name: Desktop sync integration tests
        env:
          XPOS_TEST_DB_HOST: 127.0.0.1
          XPOS_TEST_DB_PORT: "3306"
          XPOS_TEST_DB_USER: root
          XPOS_TEST_DB_PASSWORD: root
        run: yarn test:integration

  backend-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone xpos
        uses: actions/checkout@v7
        with:
          path: xpos

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check for merge conflicts and syntax errors
        run: |
          python -m compileall -q -f "${GITHUB_WORKSPACE}/xpos/xpos"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}/xpos"; then
            echo "::error::Found merge conflict markers"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmariadb-dev mariadb-client wkhtmltopdf

      - name: Add test_site to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Configure MariaDB
        run: |
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e \
            "SET GLOBAL character_set_server = 'utf8mb4';
             SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install bench and set up site
        env:
          # Same versions the server image runs (image/build-and-push.sh in
          # the deployment repo), so tests see the API the tills sync with.
          FRAPPE_REF: v16.33.1
          ERPNEXT_REF: v16.34.2
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" \
            --frappe-branch "$FRAPPE_REF" ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench get-app --branch "$ERPNEXT_REF" erpnext
          bench get-app xpos "${GITHUB_WORKSPACE}/xpos"
          bench new-site test_site \
            --db-root-username root \
            --db-root-password root \
            --db-host 127.0.0.1 \
            --admin-password admin \
            --install-app erpnext \
            --install-app xpos
          bench --site test_site set-config allow_tests true

      - name: Run tests
        run: cd ~/frappe-bench && bench --site test_site run-tests --app xpos

      # Desktop round-trip: the Electron sync engine and a real local MariaDB
      # against this site, served over HTTP (frontend/tests/roundtrip).
      - name: Seed the round-trip site
        run: |
          cd ~/frappe-bench
          bench --site test_site execute xpos.tests.round_trip.setup --kwargs '{"out": "/tmp/xpos-rt.json"}'

      - name: Serve the site
        run: |
          cd ~/frappe-bench
          nohup bench serve --port 8000 > /tmp/bench-serve.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://test_site:8000/api/method/ping && exit 0
            sleep 2
          done
          echo "::error::bench serve did not answer"; cat /tmp/bench-serve.log; exit 1

      - name: Install frontend dependencies
        working-directory: xpos/frontend
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: yarn install --frozen-lockfile

      - name: Desktop round-trip tests
        working-directory: xpos/frontend
        env:
          XPOS_RT_CONFIG: /tmp/xpos-rt.json
          XPOS_RT_URL: http://test_site:8000
          XPOS_TEST_DB_HOST: 127.0.0.1
          XPOS_TEST_DB_PORT: "3306"
          XPOS_TEST_DB_USER: root
          XPOS_TEST_DB_PASSWORD: root
          XPOS_TEST_DB_NAME: test_xpos_rt
        run: yarn test:roundtrip

      # The built desktop app, driven by Playwright through a day on a new till against
      # this site (frontend/tests/desktop). Electron's binary was skipped at install.
      - name: Desktop app end-to-end tests
        working-directory: xpos/frontend
        env:
          XPOS_RT_CONFIG: /tmp/xpos-rt.json
          XPOS_RT_URL: http://test_site:8000
          XPOS_TEST_DB_HOST: 127.0.0.1
          XPOS_TEST_DB_PORT: "3306"
          XPOS_TEST_DB_USER: root
          XPOS_TEST_DB_PASSWORD: root
          XPOS_TEST_DB_NAME: test_xpos_desktop
          # Ubuntu 24.04 runners refuse Chromium's sandbox helper from node_modules.
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          node node_modules/electron/install.js
          yarn build:electron
          xvfb-run -a yarn test:desktop

      - name: Desktop test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e
          path: |
            xpos/frontend/playwright-report/
            xpos/frontend/test-results/
          retention-days: 7

      - name: Server logs
        if: failure()
        run: |
          tail -n 150 /tmp/bench-serve.log || true
          tail -n 150 ~/frappe-bench/logs/*.log || true
