appId: com.xpos.app
productName: X POS
copyright: Copyright © 2026 Kodlyft

directories:
  buildResources: build
  output: release

afterPack: scripts/afterPack.mjs

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules"

extraMetadata:
  main: dist-electron/main.js
  # Electron names the app, and its data folder, from this. Without it the
  # installed app ran as "xpos-frontend", the development build's name.
  productName: X POS

extraResources:
  - from: electron/database/schema.sql
    to: schema.sql

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
  icon: build/icon.ico
  legalTrademarks: X POS

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: X POS

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}.${ext}
  icon: build/icon.icns
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}
  icon: build/icon.png
  category: Office

publish:
  provider: github
  owner: VigesimalTech
  repo: xpos
